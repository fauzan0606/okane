name: Fix Excel Date Parser

on:
  push:
    branches:
      - feat/investment-enhancements-local
    paths:
      - 'scripts/apply-excel-date-parse-fix.mjs'
      - '.github/workflows/fix-excel-date-parse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/investment-enhancements-local
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Excel date parser fix
        run: node scripts/apply-excel-date-parse-fix.mjs

      - name: Commit applied source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/investment/service-v3.ts scripts/apply-excel-date-parse-fix.mjs .github/workflows/fix-excel-date-parse.yml
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'fix(investments): parse Excel serial dates without SSF [skip ci]'
            git push origin HEAD:feat/investment-enhancements-local
          fi
