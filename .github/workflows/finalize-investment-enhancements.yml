name: Finalize Investment Enhancements

on:
  push:
    branches:
      - feat/investment-enhancements-local
    paths:
      - 'scripts/apply-small-final-fix.mjs'
      - '.github/workflows/finalize-investment-enhancements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/investment-enhancements-local
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply small final fix
        run: node scripts/apply-small-final-fix.mjs

      - name: Commit applied source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/investment/components/InvestmentDashboardV6.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat(investments): finish sell zero and total profit UI [skip ci]'
            git push origin HEAD:feat/investment-enhancements-local
          fi
