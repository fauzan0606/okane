name: Apply minimum sell price column

on:
  push:
    branches: [feat/phase-2-investments]

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, '[min-sell-applied]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch transaction lots table
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/investment/components/InvestmentDashboardFinal.tsx')
          s = p.read_text()
          old = '<th>Remaining</th><th>Current</th><th>P/L</th><th>Action</th>'
          new = '<th>Remaining</th><th>Current</th><th>Min. Sell</th><th>P/L</th><th className="text-right">Action</th>'
          if old not in s:
              raise SystemExit('Expected table header was not found')
          s = s.replace(old, new, 1)
          old = '<td>{row.currentPrice != null ? money(row.currentPrice,row.asset.currency.code) : "—"}</td><td className={Number(row.unrealizedGainLoss)>=0 ? "text-emerald-300" : "text-red-300"}>{Number(row.remainingQuantity)>0 ? money(row.unrealizedGainLoss,row.asset.currency.code) : "—"}</td><td><div className="flex items-center gap-2">'
          new = '<td>{row.currentPrice != null ? money(row.currentPrice,row.asset.currency.code) : "—"}</td><td className="whitespace-nowrap font-medium text-amber-300">{Number(row.remainingQuantity)>0 ? money(row.minimumSellPrice,row.asset.currency.code) : "—"}</td><td className={Number(row.unrealizedGainLoss)>=0 ? "text-emerald-300" : "text-red-300"}>{Number(row.remainingQuantity)>0 ? money(row.unrealizedGainLoss,row.asset.currency.code) : "—"}</td><td><div className="flex items-center justify-end gap-2">'
          if old not in s:
              raise SystemExit('Expected table row was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_apply-min-sell.yml
          git add modules/investment/components/InvestmentDashboardFinal.tsx
          git commit -m "fix(investments): show minimum sell price column [min-sell-applied]"
          git push
