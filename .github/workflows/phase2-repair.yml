name: Phase 2 Repair

on:
  push:
    branches: [feat/phase-2-investments]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-2-investments

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair schema relation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('prisma/schema.prisma')
          s = p.read_text()
          old = '  investmentAssets InvestmentAsset[]\n  investmentTransactions InvestmentTransaction[]\n}'
          new = '  investmentAssets InvestmentAsset[]\n  investmentTransactions InvestmentTransaction[]\n  investmentAccounts InvestmentAccount[]\n}'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          elif '  investmentAccounts InvestmentAccount[]' not in s:
              raise SystemExit('Expected Currency relation block not found')
          PY

      - name: Repair ESLint dependency and lockfile
        run: npm install --save-dev eslint-config-next@16.3.0 --package-lock-only --ignore-scripts

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/schema.prisma package.json package-lock.json
          git diff --cached --quiet || git commit -m "fix(ci): repair Phase 2 schema and lint dependencies"
          git push origin HEAD:feat/phase-2-investments

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
